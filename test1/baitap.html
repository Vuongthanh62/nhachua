<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy House - Bài Tập Nhóm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fff2d0; /* Vanilla Milk */
            color: #2b3a4a;
        }

        /* Thanh Menu Navigation */
        nav {
            background-color: #81a9ee; /* Dreamy Blue */
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            border-bottom: 3px solid #ffdb83;
            box-shadow: 0 4px 15px rgba(62, 102, 143, 0.2);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(43, 58, 74, 0.3);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 15px;
            transition: all 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #2b3a4a;
            background-color: #ffdb83; /* Butter Honey */
        }

        /* Layout Container */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #3e668f;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
        }

        /* Form Đăng Bài Tập */
        .post-form-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 18px;
            border: 2px solid #aab4e7;
            box-shadow: 0 6px 20px rgba(129, 169, 238, 0.15);
            margin-bottom: 40px;
        }

        .post-form-card h2 {
            font-size: 1.3rem;
            color: #3e668f;
            margin-bottom: 20px;
            border-bottom: 2px solid #ffdb83;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: #3e668f;
            font-size: 0.95rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #aab4e7;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fafafa;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #81a9ee;
            background-color: #ffffff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .btn-submit {
            background-color: #81a9ee;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(129, 169, 238, 0.3);
            display: block;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: #ffdb83;
            color: #2b3a4a;
            box-shadow: 0 4px 12px rgba(255, 219, 131, 0.5);
        }

        /* Danh Sách Bài Tập Đã Đăng */
        .exercise-list-title {
            font-size: 1.5rem;
            color: #3e668f;
            margin-bottom: 20px;
        }

        .exercise-card {
            background: #ffffff;
            border-radius: 15px;
            border: 2px solid #aab4e7;
            box-shadow: 0 4px 15px rgba(129, 169, 238, 0.1);
            margin-bottom: 20px;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .exercise-card:hover {
            border-color: #ffdb83;
        }

        /* Tiêu đề bài tập */
        .exercise-header {
            padding: 20px;
            background-color: #ffffff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .exercise-header h3 {
            color: #3e668f;
            font-size: 1.2rem;
        }

        .toggle-icon {
            font-size: 1.2rem;
            color: #81a9ee;
            font-weight: bold;
            transition: transform 0.3s;
        }

        /* Nội dung chi tiết */
        .exercise-body {
            display: none;
            padding: 20px;
            background-color: #fff2d0;
            border-top: 1px solid #aab4e7;
        }

        .exercise-body img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #aab4e7;
        }

        .code-block {
            background: #2b3a4a;
            color: #fff2d0;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 0.9rem;
            overflow-x: auto;
        }

        .exercise-card.active .exercise-body {
            display: block;
        }

        .exercise-card.active .toggle-icon {
            transform: rotate(180deg);
        }

        /* Thông báo khi chưa có bài tập */
        .empty-message {
            text-align: center;
            color: #728498;
            font-style: italic;
            padding: 30px;
            background: #ffffff;
            border-radius: 15px;
            border: 1px dashed #aab4e7;
        }

        footer {
            text-align: center;
            padding: 25px;
            background-color: #81a9ee;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            border-top: 3px solid #ffdb83;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">Cozy House 🏡</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="baitap.html" class="active">Bài Tập Nhóm</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1>Quản Lý Bài Tập Nhóm</h1>

        <!-- Khu Vực Đăng Bài Tập -->
        <div class="post-form-card">
            <h2>Đăng Bài Tập Mới</h2>
            <form id="exerciseForm">
                <div class="form-group">
                    <label for="title">Tên Bài Tập:</label>
                    <input type="text" id="title" placeholder="Nhập tên hoặc số thứ tự bài..." required>
                </div>
                <div class="form-group">
                    <label for="imageUrl">Đường dẫn ảnh minh họa (Link URL):</label>
                    <input type="text" id="imageUrl" placeholder="Dán link ảnh tại đây (Không bắt buộc)...">
                </div>
                <div class="form-group">
                    <label for="codeContent">Nội dung Bài tập / Đoạn Code:</label>
                    <textarea id="codeContent" placeholder="Dán mã code hoặc ghi chú bài tập vào đây..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">+ Đăng Bài Tập</button>
            </form>
        </div>

        <!-- Danh Sách Bài Tập Đã Đăng -->
        <h2 class="exercise-list-title">Danh Sách Bài Tập Đã Đăng</h2>
        <div id="exerciseList">
            <!-- Thông báo trống khi chưa đăng bài nào -->
            <div id="emptyMessage" class="empty-message">
                Chưa có bài tập nào được đăng. Hãy điền thông tin ở khung trên để thêm bài mới!
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Nhóm Cozy House. All rights reserved.</p>
    </footer>

    <!-- JavaScript Xử Lý Tương Tác và Hiển Thị Ngay Lập Tức -->
    <script>
        // Hàm bật/tắt mở rộng thẻ bài tập
        function toggleCard(headerElement) {
            const card = headerElement.parentElement;
            card.classList.toggle('active');
        }

        // Hàm hỗ trợ hiển thị ký tự đặc biệt trong code an toàn
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Tải danh sách bài tập đã lưu khi vừa mở trang
        document.addEventListener('DOMContentLoaded', loadExercises);

        function loadExercises() {
            const savedExercises = JSON.parse(localStorage.getItem('cozy_exercises')) || [];
            if (savedExercises.length > 0) {
                const emptyMsg = document.getElementById('emptyMessage');
                if (emptyMsg) emptyMsg.style.display = 'none';
                savedExercises.forEach(ex => renderExerciseCard(ex, false));
            }
        }

        // Hàm dựng khung thẻ bài tập lên giao diện
        function renderExerciseCard(ex, isNew = true) {
            const list = document.getElementById('exerciseList');
            const emptyMsg = document.getElementById('emptyMessage');
            if (emptyMsg) emptyMsg.style.display = 'none';

            const newCard = document.createElement('div');
            newCard.className = 'exercise-card';

            let imgHTML = '';
            if (ex.imageUrl && ex.imageUrl.trim() !== '') {
                imgHTML = `<p style="margin-bottom: 10px; font-weight: 600;">Ảnh minh họa:</p>
                           <img src="${ex.imageUrl}" alt="${ex.title}" onerror="this.style.display='none'">`;
            }

            newCard.innerHTML = `
                <div class="exercise-header" onclick="toggleCard(this)">
                    <h3>${ex.title}</h3>
                    <span class="toggle-icon">&#9660;</span>
                </div>
                <div class="exercise-body">
                    ${imgHTML}
                    <p style="margin-bottom: 10px; font-weight: 600;">Nội dung / Code:</p>
                    <div class="code-block">${escapeHTML(ex.codeContent)}</div>
                </div>
            `;

            if (isNew) {
                list.insertBefore(newCard, list.firstChild);
                newCard.classList.add('active'); // Tự động mở bài vừa đăng để xem luôn
            } else {
                list.appendChild(newCard);
            }
        }

        // Xử lý khi nhấn nút Đăng Bài Tập
        document.getElementById('exerciseForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const codeContent = document.getElementById('codeContent').value;

            const newExercise = { title, imageUrl, codeContent };

            // Lưu vào bộ nhớ trình duyệt để không bị mất khi F5
            const savedExercises = JSON.parse(localStorage.getItem('cozy_exercises')) || [];
            savedExercises.unshift(newExercise);
            localStorage.setItem('cozy_exercises', JSON.stringify(savedExercises));

            // Hiển thị ngay lên màn hình lập tức
            renderExerciseCard(newExercise, true);

            // Xóa sạch dữ liệu trong khung nhập sau khi đăng thành công
            document.getElementById('exerciseForm').reset();
        });
    </script>
</body>
</html>
