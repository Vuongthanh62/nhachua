<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhà Chùa - Nơi Tu Tâm Dưỡng Tính</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            display: none;
            min-height: 100vh;
            width: 100%;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        .hero {
            position: relative;
            height: 60vh;
            width: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(15, 15, 18, 1)), 
                        url('https://cdn3.ivivu.com/2019/09/nhung-ngoi-chua-co-khung-canh-tuyet-dep-o-nhat-ban-ivivu-16.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 1.3rem;
            color: #e0e0e0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .content-container {
            flex: 1;
            background-color: #0f0f12;
            padding: 40px 20px 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .card {
            width: 320px;
            height: 240px;
            background: #1a1a24;
            border: 2px solid #2a2a3a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 20px;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #ffb703;
            box-shadow: 0 15px 35px rgba(255, 183, 3, 0.2);
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 1.5rem;
            color: #ffb703;
        }

        /* Back Button */
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid #ffb703;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .btn-back:hover {
            background: #ffb703;
            color: #000;
        }

        /* Page Gõ Mõ */
        #page-gomo {
            position: relative;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), 
                        url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3hNwgm11GC8jafjbYXVku8hD5Og4rKrfaoKinII0aYg&s=10') center/cover no-repeat;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .cong-duc-counter {
            font-size: 2.2rem;
            color: #ffb703;
            margin-bottom: 40px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 183, 3, 0.5);
            background: rgba(0,0,0,0.5);
            padding: 12px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 183, 3, 0.3);
        }

        .mo-wrapper {
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .mo-img {
            width: 220px;
            height: 220px;
            font-size: 10rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.08s ease;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
        }

        .mo-img:active {
            transform: scale(0.92);
        }

        .mo-img.zoom {
            transform: scale(1.15);
        }

        .floating-text {
            position: absolute;
            color: #ffb703;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }

        /* Page Gieo Quẻ */
        #page-gieoque {
            position: relative;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), 
                        url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7N1FshZu7iius4JFhh3tbB_P-AmbUdz7c1br0N9fBOPeRU1NEG9czLIsq&s=10') center/cover no-repeat;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .que-box {
            background: rgba(26, 26, 36, 0.85);
            border: 2px solid #ffb703;
            border-radius: 20px;
            padding: 35px 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        .que-box h2 {
            color: #ffb703;
            margin-bottom: 25px;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: #0f0f12;
            border: 1px solid #3a3a4a;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus {
            border-color: #ffb703;
        }

        .btn-gieo {
            width: 100%;
            padding: 14px;
            background: #ffb703;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .btn-gieo:hover {
            background: #ffa000;
        }

        .btn-gieo:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        .loading-area {
            display: none;
            margin-top: 20px;
        }

        .loading-spinner {
            font-size: 3rem;
            animation: shake 0.5s infinite alternate;
            display: inline-block;
        }

        @keyframes shake {
            0% { transform: rotate(-10deg) translateY(0); }
            100% { transform: rotate(10deg) translateY(-10px); }
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #2a2a3a;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ffb703;
            transition: width 5s linear;
        }

        .result-area {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(255, 183, 3, 0.1);
            border: 1px dashed #ffb703;
            border-radius: 12px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffb703;
            margin-bottom: 10px;
        }

        .result-desc {
            font-size: 1rem;
            line-height: 1.5;
            color: #ddd;
        }
    </style>
</head>
<body>

    <div id="page-home" class="page active">
        <div class="hero">
            <h1>Welcome to Nhà Chùa</h1>
            <p>Nơi tu tâm dưỡng tính, tích đức tích phước</p>
        </div>
        <div class="content-container">
            <div class="card" onclick="switchPage('page-gomo')">
                <div class="card-icon">🔔</div>
                <h3>Gõ Mõ Tích Đức</h3>
            </div>
            <div class="card" onclick="switchPage('page-gieoque')">
                <div class="card-icon">🎋</div>
                <h3>Gieo Quẻ thử xem</h3>
            </div>
        </div>
    </div>

    <div id="page-gomo" class="page">
        <button class="btn-back" onclick="switchPage('page-home')">← Trở về</button>
        <div class="cong-duc-counter">Công Đức: <span id="score">0</span></div>
        <div class="mo-wrapper" onclick="goMo(event)">
            <div class="mo-img" id="mo">🔔</div>
        </div>
    </div>

    <div id="page-gieoque" class="page">
        <button class="btn-back" onclick="switchPage('page-home')">← Trở về</button>
        <div class="que-box">
            <h2>Gieo Quẻ Vấn Danh</h2>
            <form id="queForm" onsubmit="handleGieoQue(event)">
                <div class="form-group">
                    <label for="fullname">Họ và Tên</label>
                    <input type="text" id="fullname" placeholder="Nhập họ tên của bạn..." required>
                </div>
                <div class="form-group">
                    <label for="dob">Ngày Tháng Năm Sinh</label>
                    <input type="date" id="dob" required>
                </div>
                <button type="submit" id="btnSubmit" class="btn-gieo">Bắt Đầu Gieo Quẻ</button>
            </form>

            <div id="loadingArea" class="loading-area">
                <div class="loading-spinner">🎋</div>
                <p style="margin-top: 10px; color: #aaa;">Đang thành tâm khấn nguyện (5s)...</p>
                <div class="progress-bar-container">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
            </div>

            <div id="resultArea" class="result-area">
                <div id="resultTitle" class="result-title"></div>
                <div id="resultDesc" class="result-desc"></div>
            </div>
        </div>
    </div>

    <script>
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        let congDuc = 0;
        const scoreElem = document.getElementById('score');
        const moElem = document.getElementById('mo');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playWoodblockSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function goMo(e) {
            congDuc++;
            scoreElem.textContent = congDuc;

            playWoodblockSound();

            moElem.classList.add('zoom');
            setTimeout(() => moElem.classList.remove('zoom'), 100);

            const text = document.createElement('div');
            text.className = 'floating-text';
            text.textContent = '+1 Công Đức';
            
            const rect = moElem.getBoundingClientRect();
            const x = e.clientX || (rect.left + rect.width / 2);
            const y = e.clientY || (rect.top + rect.height / 2);

            text.style.left = `${x - 40}px`;
            text.style.top = `${y - 40}px`;

            document.body.appendChild(text);
            setTimeout(() => text.remove(), 1000);
        }

        let hasGieo = false;

        const queList = [
            {
                name: "ĐẠI CÁT",
                desc: "Vạn sự như ý, tâm niệm đều thành. Năm mới công danh thuận lợi, gia đạo an yên, phước báu ngập tràn."
            },
            {
                name: "CÁT",
                desc: "Mọi việc hanh thông, gặp nhiều may mắn. Chỉ cần kiên trì tu tâm tích đức thì quả ngọt sẽ tới mau chóng."
            },
            {
                name: "CÁT HANH",
                desc: "Hạnh phúc vẹn tròn, đường đi nước bước có quý nhân phù trợ. Hãy giữ tâm sáng và tiếp tục gieo duyên lành."
            },
            {
                name: "BÌNH HÒA",
                desc: "Cuộc sống bình ổn, không sóng gió đại nạn. Hãy bằng lòng với hiện tại, tĩnh tâm dưỡng tính để tích thêm phước."
            },
            {
                name: "HUNG",
                desc: "Thách thức chực chờ, cần cẩn trọng trong lời ăn tiếng nói và quyết định lớn. Nên năng làm việc thiện để giải bớt nghiệp."
            },
            {
                name: "ĐẠI HUNG",
                desc: "Có điềm sóng gió. Chớ vội đầu tư lớn hay tranh chấp. Hãy an phận thủ thường, chăm chỉ phóng sinh, sám hối tích đức."
            }
        ];

        function handleGieoQue(e) {
            e.preventDefault();
            if (hasGieo) return;

            const name = document.getElementById('fullname').value.trim();
            const dob = document.getElementById('dob').value;
            if (!name || !dob) return;

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Đang Gieo Quẻ...";

            const loadingArea = document.getElementById('loadingArea');
            const progressBar = document.getElementById('progressBar');
            loadingArea.style.display = 'block';

            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 50);

            setTimeout(() => {
                loadingArea.style.display = 'none';
                hasGieo = true;

                const randomQue = queList[Math.floor(Math.random() * queList.length)];

                const resultArea = document.getElementById('resultArea');
                const resultTitle = document.getElementById('resultTitle');
                const resultDesc = document.getElementById('resultDesc');

                resultTitle.textContent = `Quẻ của ${name}: ${randomQue.name}`;
                resultDesc.textContent = randomQue.desc;
                resultArea.style.display = 'block';

                btnSubmit.textContent = "Đã Gieo Quẻ (Mỗi lượt vào web chỉ gieo 1 lần)";
            }, 5000);
        }
    </script>
</body>
</html>
