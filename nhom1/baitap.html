<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy House - Bài Tập Nhóm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Firestore SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDk3S660npUZjDCFPdeOUii7xt6RzYjwM",
            authDomain: "cozyhousebaitap.firebaseapp.com",
            projectId: "cozyhousebaitap",
            storageBucket: "cozyhousebaitap.firebasestorage.app",
            messagingSenderId: "929793584736",
            appId: "1:929793584736:web:33c568f47f253a8bd4dd05"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Đưa các hàm ra biến toàn cục để script bên dưới gọi được
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.onSnapshot = onSnapshot;

        // Kích hoạt load dữ liệu sau khi Firebase sẵn sàng
        window.initFirebaseApp();
    </script>

    <style>
        :root {
            --sunshine-yellow: #FFD54F;
            --soft-butter: #FFE8A1;
            --warm-cream: #FFF7E1;
            --peach-glow: #FFB366;
            --sunlit-green: #A3B454;
            --text-main: #332C23;
            --text-sub: #635848;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--warm-cream);
            color: var(--text-main);
            line-height: 1.6;
        }

        nav {
            background-color: var(--soft-butter);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 50px;
            border-bottom: 3px solid var(--peach-glow);
            box-shadow: 0 4px 20px rgba(255, 179, 102, 0.15);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-right-container {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s ease;
            padding: 8px 18px;
            border-radius: 20px;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: var(--sunshine-yellow);
            box-shadow: 0 2px 8px rgba(255, 213, 79, 0.4);
        }

        .custom-logo-area {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px dashed var(--peach-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            overflow: hidden;
        }

        .custom-logo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .section-header h1 {
            font-size: 1.6rem; 
            color: #204a24;
            font-weight: 800;
            flex: 1;          
            word-break: break-word;
}

        .btn-action {
            background-color: var(--sunshine-yellow);
            color: var(--text-main);
            border: 2px solid var(--peach-glow);
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background-color: var(--peach-glow);
            color: #fff;
        }

        /* Thư mục */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .folder-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 22px;
            border: 2px solid #ED8990;
            box-shadow: 0 6px 15px rgba(255, 179, 102, 0.1);
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100px;
        }

        .folder-card:hover {
            transform: translateY(-4px);
            border-color: var(--peach-glow);
            background-color: #fffaf0;
        }

        .folder-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #1B2316;
            cursor: pointer;
            padding-right: 35px;
            word-break: break-word;
        }

        .menu-container {
            position: absolute;
            top: 14px;
            right: 14px;
        }

        .btn-dots {
            background: none;
            border: none;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-sub);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .btn-dots:hover {
            background: rgba(237, 137, 144, 0.2);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 36px;
            background: #ffffff;
            border: 2px solid var(--peach-glow);
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 10;
            width: 120px;
            overflow: hidden;
        }

        .dropdown-menu button {
            width: 100%;
            background: none;
            border: none;
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .dropdown-menu button:hover {
            background: var(--warm-cream);
        }

        .dropdown-menu button.delete-btn {
            color: #d90429;
        }

        .form-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #ED8990;
            margin-bottom: 30px;
            display: none;
            box-shadow: 0 8px 20px rgba(255, 179, 102, 0.1);
        }

        .form-box h2 {
            font-size: 1.3rem;
            color: #204a24;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid var(--soft-butter);
            outline: none;
            font-size: 0.95rem;
            background: #fff;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--peach-glow);
        }

        /* Bài làm */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .task-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            border: 2px solid #ED8990;
            box-shadow: 0 6px 15px rgba(255, 179, 102, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .task-question {
            font-size: 1.15rem;
            font-weight: 800;
            color: #204a24;
            padding-right: 35px;
            word-break: break-word;
        }

        .task-answer-container {
            background: var(--warm-cream);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--soft-butter);
        }

        .task-answer {
            font-size: 1rem;
            color: var(--text-main);
            white-space: pre-line;
            word-break: break-word;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            line-height: 1.6;
        }

        .task-answer.expanded {
            -webkit-line-clamp: unset;
        }

        .btn-readmore {
            background: none;
            border: none;
            color: #204a24;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.95rem;
            display: none; 
        }

        .btn-readmore:hover {
            text-decoration: underline;
        }

        .task-img {
            max-width: 180px;
            max-height: 130px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--soft-butter);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .task-img:hover {
            opacity: 0.9;
        }

        .back-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: 700;
            color: var(--text-sub);
        }

        .back-bar:hover {
            color: var(--text-main);
        }

        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 12px;
            border: 3px solid #fff;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            color: #fff;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
        }

        .confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(51, 44, 35, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
        }

        .confirm-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px 30px;
            width: 100%;
            max-width: 400px;
            border: 3px solid var(--peach-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .confirm-box h3 {
            font-size: 1.3rem;
            color: #204a24;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .confirm-box p {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .confirm-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn-confirm-yes {
            background: #d90429;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-confirm-no {
            background: #eee;
            color: var(--text-main);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Cozy House 🏡</div>
        <div class="nav-right-container">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="baitap.html" class="active">Bài Tập Nhóm</a></li>
            </ul>
            <div class="custom-logo-area" title="Logo nhóm">
                <img src="logo.png" alt="Logo">
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="folderView">
            <div class="section-header">
                <h1>Thư Mục Bài Tập</h1>
                <button class="btn-action" onclick="toggleFolderForm()">+ Tạo thư mục mới</button>
            </div>

            <div class="form-box" id="folderFormBox">
                <h2>Tạo thư mục bài tập</h2>
                <form onsubmit="addFolder(event)">
                    <div class="form-group">
                        <label>Tên thư mục</label>
                        <input type="text" id="folderNameInput" placeholder="Ví dụ: Bài 1, Bài 2..." required>
                    </div>
                    <button type="submit" class="btn-action">Tạo thư mục</button>
                </form>
            </div>

            <div class="folder-grid" id="folderGrid"></div>
        </div>

        <div id="taskView" style="display: none;">
            <div class="back-bar" onclick="backToFolders()">
                <span>← Quay lại danh sách thư mục</span>
            </div>
            
            <div class="section-header">
                <h1 id="currentFolderTitle">Tên Thư Mục</h1>
                <button class="btn-action" onclick="openAddTaskForm()">+ Đăng bài tập</button>
            </div>

            <div class="form-box" id="taskFormBox">
                <h2 id="taskFormTitle">Thêm bài tập vào thư mục</h2>
                <form onsubmit="saveTask(event)">
                    <input type="hidden" id="editingTaskId">
                    <div class="form-group">
                        <label>Câu hỏi</label>
                        <input type="text" id="questionInput" placeholder="Ví dụ: Luyện tập 1..." required>
                    </div>
                    <div class="form-group">
                        <label>Bài làm</label>
                        <textarea id="answerInput" rows="4" placeholder="Nhập phần trình bày bài làm..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Ảnh hoặc file đính kèm (không bắt buộc)</label>
                        <input type="file" id="fileInput" accept="image/*">
                    </div>
                    <button type="submit" class="btn-action" id="taskSubmitBtn">Lưu bài làm</button>
                </form>
            </div>

            <div class="task-list" id="taskList"></div>
        </div>
    </div>

    <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightboxImg">
    </div>

    <div class="confirm-overlay" id="confirmModal">
        <div class="confirm-box">
            <h3>Confirm</h3>
            <p id="confirmMessage">Bạn có chắc chắn muốn xóa không?</p>
            <div class="confirm-actions">
                <button class="btn-confirm-no" onclick="closeConfirm(false)">Cancel</button>
                <button class="btn-confirm-yes" onclick="closeConfirm(true)">OK</button>
            </div>
        </div>
    </div>

    <script>
        let folders = [];
        let tasks = [];
        let activeFolderId = null;
        let activeFolderName = "";
        let confirmCallback = null;

        window.initFirebaseApp = function() {
            window.onSnapshot(window.collection(window.db, "folders"), (snapshot) => {
                folders = [];
                snapshot.forEach((doc) => {
                    folders.push({ id: doc.id, ...doc.data() });
                });
                renderFolders();
            });

            window.onSnapshot(window.collection(window.db, "tasks"), (snapshot) => {
                tasks = [];
                snapshot.forEach((doc) => {
                    tasks.push({ id: doc.id, ...doc.data() });
                });
                if (activeFolderId) {
                    renderTasks();
                }
            });
        };

        function showConfirm(message, callback) {
            document.getElementById('confirmMessage').innerText = message;
            document.getElementById('confirmModal').style.display = 'flex';
            confirmCallback = callback;
        }

        function closeConfirm(result) {
            document.getElementById('confirmModal').style.display = 'none';
            if (result && confirmCallback) {
                confirmCallback();
            }
            confirmCallback = null;
        }

        window.onclick = function(event) {
            if (!event.target.matches('.btn-dots')) {
                document.querySelectorAll('.dropdown-menu').forEach(menu => menu.style.display = 'none');
            }
        }

        function toggleMenu(event, menuId) {
            event.stopPropagation();
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                if (menu.id !== menuId) menu.style.display = 'none';
            });
            const menu = document.getElementById(menuId);
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function renderFolders() {
            const grid = document.getElementById('folderGrid');
            if (!grid) return;
            grid.innerHTML = '';
            
            if (folders.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-sub); grid-column: 1 / -1; text-align: center; padding: 20px;">Chưa có thư mục nào. Hãy bấm "+ Tạo thư mục mới" để bắt đầu nhé!</p>`;
                return;
            }

            folders.forEach(folder => {
                grid.innerHTML += `
                    <div class="folder-card">
                        <div class="folder-title" onclick="openFolder('${folder.id}', '${escapeHtml(folder.name)}')">
                            ${escapeHtml(folder.name)}
                        </div>
                        <div class="menu-container">
                            <button class="btn-dots" onclick="toggleMenu(event, 'folderMenu-${folder.id}')">⋮</button>
                            <div class="dropdown-menu" id="folderMenu-${folder.id}">
                                <button class="delete-btn" onclick="deleteFolder('${folder.id}')">Xóa</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function addFolder(e) {
            e.preventDefault();
            const name = document.getElementById('folderNameInput').value;
            try {
                await window.addDoc(window.collection(window.db, "folders"), { name });
                document.getElementById('folderNameInput').value = '';
                toggleFolderForm();
            } catch (err) {
                console.error("Lỗi tạo thư mục: ", err);
            }
        }

        function deleteFolder(folderId) {
            showConfirm('Bạn có chắc chắn muốn xóa thư mục này cùng tất cả bài tập bên trong không?', async () => {
                try {
                    // Xóa thư mục
                    await window.deleteDoc(window.doc(window.db, "folders", folderId));
                    // Xóa các bài tập thuộc thư mục này
                    const folderTasks = tasks.filter(t => t.folderId === folderId);
                    for (let t of folderTasks) {
                        await window.deleteDoc(window.doc(window.db, "tasks", t.id));
                    }
                    if (activeFolderId === folderId) {
                        backToFolders();
                    }
                } catch (err) {
                    console.error("Lỗi xóa thư mục: ", err);
                }
            });
        }

        function toggleFolderForm() {
            const box = document.getElementById('folderFormBox');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function openFolder(folderId, folderName) {
            activeFolderId = folderId;
            activeFolderName = folderName;
            document.getElementById('currentFolderTitle').innerText = folderName;
            document.getElementById('folderView').style.display = 'none';
            document.getElementById('taskView').style.display = 'block';
            document.getElementById('taskFormBox').style.display = 'none';
            renderTasks();
        }

        function backToFolders() {
            activeFolderId = null;
            document.getElementById('taskView').style.display = 'none';
            document.getElementById('folderView').style.display = 'block';
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            const folderTasks = tasks.filter(t => t.folderId === activeFolderId);

            if (folderTasks.length === 0) {
                list.innerHTML = `<p style="color: var(--text-sub); text-align: center; padding: 20px;">Chưa có bài tập nào trong thư mục này.</p>`;
                return;
            }

            folderTasks.forEach(task => {
                let imgHtml = task.img ? `<img src="${task.img}" class="task-img" alt="Đính kèm" onclick="openLightbox('${task.img}')">` : '';
                list.innerHTML += `
                    <div class="task-item">
                        <div class="task-question">${escapeHtml(task.question)}</div>
                        <div class="menu-container">
                            <button class="btn-dots" onclick="toggleMenu(event, 'taskMenu-${task.id}')">⋮</button>
                            <div class="dropdown-menu" id="taskMenu-${task.id}">
                                <button onclick="editTask('${task.id}')">Chỉnh sửa</button>
                                <button class="delete-btn" onclick="deleteTask('${task.id}')">Xóa</button>
                            </div>
                        </div>
                        <div class="task-answer-container">
                            <div class="task-answer" id="answer-${task.id}">${escapeHtml(task.answer)}</div>
                            <button class="btn-readmore" id="btn-readmore-${task.id}" onclick="toggleReadMore('${task.id}')">... Xem thêm</button>
                        </div>
                        ${imgHtml}
                    </div>
                `;
            });

            folderTasks.forEach(task => {
                const el = document.getElementById(`answer-${task.id}`);
                const btn = document.getElementById(`btn-readmore-${task.id}`);
                if (el) {
                    if (el.scrollHeight > el.clientHeight + 5) {
                        btn.style.display = 'inline-block';
                    } else {
                        btn.style.display = 'none';
                    }
                }
            });
        }

        function toggleReadMore(taskId) {
            const el = document.getElementById(`answer-${taskId}`);
            const btn = document.getElementById(`btn-readmore-${taskId}`);
            if (el.classList.contains('expanded')) {
                el.classList.remove('expanded');
                btn.innerText = 'Xem thêm';
            } else {
                el.classList.add('expanded');
                btn.innerText = 'Rút gọn';
            }
        }

        function openAddTaskForm() {
            document.getElementById('editingTaskId').value = '';
            document.getElementById('taskFormTitle').innerText = 'Thêm bài tập vào thư mục';
            document.getElementById('questionInput').value = '';
            document.getElementById('answerInput').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('taskSubmitBtn').innerText = 'Lưu bài làm';
            document.getElementById('taskFormBox').style.display = 'block';
        }

        function editTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                document.getElementById('editingTaskId').value = task.id;
                document.getElementById('taskFormTitle').innerText = 'Chỉnh sửa bài tập';
                document.getElementById('questionInput').value = task.question;
                document.getElementById('answerInput').value = task.answer;
                document.getElementById('fileInput').value = '';
                document.getElementById('taskSubmitBtn').innerText = 'Cập nhật bài làm';
                document.getElementById('taskFormBox').style.display = 'block';
                window.scrollTo({ top: document.getElementById('taskFormBox').offsetTop - 80, behavior: 'smooth' });
            }
        }

        function deleteTask(taskId) {
            showConfirm('Bạn có chắc chắn muốn xóa bài tập này không?', async () => {
                try {
                    await window.deleteDoc(window.doc(window.db, "tasks", taskId));
                } catch (err) {
                    console.error("Lỗi xóa bài tập: ", err);
                }
            });
        }

        function saveTask(e) {
            e.preventDefault();
            const editingId = document.getElementById('editingTaskId').value;
            const question = document.getElementById('questionInput').value;
            const answer = document.getElementById('answerInput').value;
            const fileInput = document.getElementById('fileInput');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    processSaveTask(editingId, question, answer, event.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                const existingTask = tasks.find(t => t.id == editingId);
                const img = existingTask ? existingTask.img : '';
                processSaveTask(editingId, question, answer, img);
            }
        }

        async function processSaveTask(editingId, question, answer, img) {
            try {
                if (editingId) {
                    const taskRef = window.doc(window.db, "tasks", editingId);
                    await window.updateDoc(taskRef, { question, answer, img });
                } else {
                    await window.addDoc(window.collection(window.db, "tasks"), {
                        folderId: activeFolderId,
                        question,
                        answer,
                        img
                    });
                }
                document.getElementById('taskFormBox').style.display = 'none';
            } catch (err) {
                console.error("Lỗi lưu bài tập: ", err);
            }
        }

        function openLightbox(imgSrc) {
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('lightboxModal').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').style.display = 'none';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
